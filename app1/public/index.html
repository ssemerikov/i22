<!DOCTYPE html>
<html lang="uk">  
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Бібліотека</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Ласкаво просимо до нашої бібліотеки</h1>
        <div class="container">
            <h2>У нас є багато книг для вас!</h2>
            <div class="form-group">
                <label for="add-book">Додавання книги:</label>
                <input type="text" id="title"  
                    placeholder="Введіть назву книги...">
                <input type="text" id="author"  
                    placeholder="Введіть ім'я автора...">
                <button onclick="addBook()">Додати</button>    
            </div>
            <!-- Список книг -->
            <div id="book-list">
                <h2>Список книг</h2>
                <ul id="books-list"></ul>
            </div>
            <!-- Статус -->
            <h2>Статус</h2>
            <div id="status"></div>
        </div>
        <script src="client.js"></script>
    </body>
</html>
